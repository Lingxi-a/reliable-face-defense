[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-face-defense-fullsystem"
version = "0.7.0"
description = "Integrated Reliability-First Blue-RPP-Red face defense system"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "torch>=2.0",
  "lpips>=0.1.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
